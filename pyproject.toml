[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "Multi-agent orchestration platform with tool use, memory, and human-in-the-loop escalation"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60",
    "langchain>=1.0",
    "langchain-core>=0.3.28",
    "langchain-openai>=0.2.14",
    "langchain-anthropic>=0.3.1",
    "langchain-mcp-adapters>=0.0.5",
    "mcp>=1.1.0",
    "openai>=1.58.1",
    "anthropic>=0.40.0",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.0",
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.1",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "langgraph-checkpoint-postgres>=2.0.13",
    "chromadb>=0.5.23",
    "ddgs>=8.1.1",
    "docker>=7.1.0",
    "streamlit>=1.41.1",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
